name: Bug report
description: Report a reproducible problem in CodeJudge
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "For security vulnerabilities, do not use this public form. Follow SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: Describe the bug
      description: A clear description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start the service...\n2. Submit...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Docker version, browser, commit
    validations:
      required: false
