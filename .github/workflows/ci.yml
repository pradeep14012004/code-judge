name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend dependency install and syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install auth service dependencies
        working-directory: services/auth-service
        run: npm ci
      - name: Install problem service dependencies
        working-directory: services/problem-service
        run: npm ci
      - name: Install submission service dependencies
        working-directory: services/submission-service
        run: npm install --ignore-scripts
      - name: Check backend JavaScript syntax
        run: find services -type f -name '*.js' -print0 | xargs -0 -n1 node --check
